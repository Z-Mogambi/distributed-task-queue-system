services:
  redis:
    image: redis:7-alpine
    ports:
      # Published on 6380 so the stack can run alongside a local redis-server
      # on 6379. Inside the compose network services still use redis:6379.
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: task-queue-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - output-data:/app/output
    command: ["python", "task_workers/worker.py", "Worker-1"]

  worker-2:
    image: task-queue-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - output-data:/app/output
    command: ["python", "task_workers/worker.py", "Worker-2"]

  worker-3:
    image: task-queue-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - output-data:/app/output
    command: ["python", "task_workers/worker.py", "Worker-3"]

  load_test:
    build:
      context: .
      dockerfile: Dockerfile.load_test
    depends_on:
      api:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  redis-data:
  output-data:
