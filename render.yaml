services:
  # Redis Database
  - type: redis
    name: task-queue-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # API Server (Public)
  - type: web
    name: task-queue-api
    region: singapore
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python task_api/server.py
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: task-queue-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: task-queue-redis
          property: port
    healthCheckPath: /health

  # Worker 1
  - type: worker
    name: task-queue-worker-1
    region: singapore
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python task_workers/worker.py Worker-1
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: task-queue-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: task-queue-redis
          property: port

  # Worker 2
  - type: worker
    name: task-queue-worker-2
    region: singapore
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python task_workers/worker.py Worker-2
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: task-queue-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: task-queue-redis
          property: port

  # Worker 3
  - type: worker
    name: task-queue-worker-3
    region: singapore
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python task_workers/worker.py Worker-3
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: task-queue-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: task-queue-redis
          property: port
          